name: Markdown to PDF

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.markdown'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markdown-to-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove stale PDFs
        run: rm -rf pdfs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PDFs with md-to-pdf
        run: |
          mkdir -p pdfs
          shopt -s nullglob
          for f in *.md *.markdown; do
            echo "Converting: $f"
            npx --yes md-to-pdf "$f"
            mv "${f%.*}.pdf" "pdfs/"
          done
          if [ -z "$(ls -A pdfs)" ]; then
            echo "No PDFs were generated."
            exit 1
          fi

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-pdfs
          path: pdfs/*.pdf
          if-no-files-found: error

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdfs/
          if git diff --staged --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "chore: update PDF exports"
            git push
          fi
